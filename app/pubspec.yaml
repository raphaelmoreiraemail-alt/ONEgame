name: onegame
description: "OneGame — one alarm, two minutes, one game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  cupertino_ui: ^1.1.7
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flame_forge2d: ^0.20.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
